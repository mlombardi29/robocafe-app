# Private test site. In Netlify: production branch = kioskops-v1 (not main).
# main keeps serving the old app on GitHub Pages.
# The public Supabase URL and anon key are in app/.env.production.
# Env vars already set in Netlify override that file. Do not put the service role key here.
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
