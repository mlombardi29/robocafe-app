photo_shots:
  - "Overall shot of the kiosk interior, generally clean, before closing up."
  - "The Cameo (UofT: the milk module) while the cleaning is running."
  - "Espresso beans topped up (UofT: coffee concentrate)."
  - "Powders topped up."
  - "Cups and lids topped up (one angle that gets most or all of them)."
  - "The kiosk closed at the end: front glass clean, presentable."
  - "The three powder spouts facing down, and at RBC the grey-water clasp closed (perpendicular). Both cause big problems if forgotten."
why:
  s35: |
    Prep comes before milk cleaning because touching the Cameo aborts the cleaning and it has to restart. That means the bean lid, the puck bin, and the top for cleaning balls. The Cameo cleaning is about 18 minutes.
    During the cleaning you can change milk bags and top up milk. Don't touch the tubes.
    Once the cleaning starts, be as productive as possible, and aim to finish your other tasks close to when it is done.
    Turn all three powder spouts back to down-facing, or powder drinks come out as hot water.
    The claw wipe is gentle. The arm and claw are very sensitive to pressure.
    The test drink is last, after you exit maintenance mode.
    Door clearance: when a drink is made, the door slides down to the customer opening, and there is less space at the top than you see while servicing. Don't stack restocked items into the door path.
    Arm calibration is weekly and is done before maintenance mode. It cannot be done in maintenance mode.
  s22: |
    Put the kiosk in maintenance mode before the milk-module cleaning. Don't touch or change the module mid-cycle. The cleaning is about 9 minutes.
    During the cleaning you can change the milk bag and top up 2% milk. Don't touch the tubes. This kiosk is 2% only.
    Once the cleaning starts, be as productive as possible, and aim to finish your other tasks close to when it is done.
    Turn all three powder spouts back to down-facing, or powder drinks come out as hot water.
    The test drink is last, after you exit maintenance mode.
    There is no service-door clearance step, no claw, and no grey water on this model. It drains to a pipe.
  s5: |
    Prep comes before milk cleaning because touching the Cameo aborts the cleaning and it has to restart. That means the bean lid, the puck bin, and the top for cleaning balls. The Cameo cleaning is about 18 minutes.
    During the cleaning you can change milk bags and top up milk. Don't touch the tubes. The milk bag follows the 4-day rule, not every show.
    Once the cleaning starts, be as productive as possible, and aim to finish your other tasks close to when it is done.
    Turn all three powder spouts back to down-facing, or powder drinks come out as hot water.
    Grey water: turn the clasp back to perpendicular (closed) before you bring the hose in. If it stays open, the next drink's grey water floods inside the kiosk.
    The claw wipe is gentle. The arm and claw are very sensitive to pressure.
    The test drink is last, after you exit maintenance mode.
    Door clearance: when a drink is made, the door slides down to the customer opening, and there is less space at the top than you see while servicing. Don't stack restocked items into the door path.
    Arm calibration is weekly and is done before maintenance mode. It cannot be done in maintenance mode.
