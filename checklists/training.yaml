why:
  s35: |
    Prep comes before milk cleaning because touching the Cameo aborts the cleaning and it has to restart. That means the bean lid, the puck bin, and the top for cleaning balls. The Cameo cleaning is about 11 minutes and uses 30 mL EverClean (not Rinza).
    Beans: refill only below two-thirds. Powder stays below-half. Matcha is unused — leave it alone.
    During the cleaning you can change milk bags and top up milk. Don't touch the tubes.
    Once the cleaning starts, be as productive as possible, and aim to finish your other tasks close to when it is done.
    Turn all three powder spouts back to down-facing, or powder drinks come out as hot water.
    The claw wipe is gentle. The arm and claw are very sensitive to pressure.
    The test drink is last, after you exit maintenance mode.
    Door clearance: when a drink is made, the door slides down to the customer opening, and there is less space at the top than you see while servicing. Don't stack restocked items into the door path.
    Arm calibration is weekly before maintenance mode (190–210 g, Auto Calibrate). Sinai arm sensor: solid green at hot and cold.
    In Kiosoft only, milk consumables entry is actual added minus 500 mL (example 8,000 → 7,500). That does not change how much you pour or KioskOps inventory.
  s22: |
    Scale check every visit with the independent scale (190–210 g; Calibrate to 200g if needed) before maintenance mode when practical.
    Put the kiosk in maintenance mode before the milk-module cleaning. Don't touch or change the module mid-cycle. The cleaning is about 9 minutes with 750 mL water + 30 mL Rinza.
    During the cleaning you can change the milk bag and top up 2% milk. When tubes go back, suction sits 1 inch lower than the sensor. This kiosk is 2% only.
    Concentrate uses a two-thirds minimum. Powder stays below-half. Matcha is unused.
    Once the cleaning starts, be as productive as possible, and aim to finish your other tasks close to when it is done.
    Turn all three powder spouts back to down-facing, or powder drinks come out as hot water.
    The test drink is last, after you exit maintenance mode, and must be milk-based.
    In Kiosoft only, milk consumables entry is actual added minus 500 mL (example 8,000 → 7,500). That does not change how much you pour or KioskOps inventory.
    There is no service-door clearance step, no claw, and no grey water on this model. It drains to a pipe.
  s5: |
    Prep comes before milk cleaning because touching the Cameo aborts the cleaning and it has to restart. That means the bean lid, the puck bin, and the top for cleaning balls. The Cameo cleaning is about 18 minutes and uses 30 mL EverClean (not Rinza).
    Beans: refill only below two-thirds. Cups fill to the top. Matcha is unused.
    During the cleaning you can change milk bags and top up milk. Don't touch the tubes. The milk bag follows the 4-day rule, not every show.
    Once the cleaning starts, be as productive as possible, and aim to finish your other tasks close to when it is done.
    Turn all three powder spouts back to down-facing, or powder drinks come out as hot water.
    Grey water: container under the kiosk with a coiled hose — uncoil to the ground drain, drain, then close the clasp before coiling the hose back.
    The claw wipe is gentle. The arm and claw are very sensitive to pressure.
    The test drink is last, after you exit maintenance mode.
    Door clearance: when a drink is made, the door slides down to the customer opening, and there is less space at the top than you see while servicing. Don't stack restocked items into the door path.
    Arm calibration is weekly before maintenance mode (190–210 g, Auto Calibrate). Arm sensor solid-green check is Sinai only — at RBC mark Not needed.
    In Kiosoft only, milk consumables entry is actual added minus 500 mL (example 8,000 → 7,500). That does not change how much you pour or KioskOps inventory.
