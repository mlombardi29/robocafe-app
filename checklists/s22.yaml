code: s22
name: Series 2.2
milk_clean_minutes: 9
sections:
  - phase: before_maint
    title: Before maintenance mode
    items:
      - key: kc_sign_in
        title: "Sign in to KC Manager: scan your QR code at the kiosk"
        cadence: every_visit
        required: true
      - key: gloves
        title: Wash hands, put on gloves
        cadence: every_visit
        required: true
      - key: scale_check
        title: Scale calibration check
        cadence: every_visit
        required: true
        details: "1. Set your separate (independent) scale to 0 g. Fill a cup with water until it weighs 200 g on that scale.\n2. At the kiosk, make sure nothing is on the scale.\n3. Open the Scale API and press Reset the scale to 0.\n4. Put the 200 g cup of water on the scale.\n5. Press Get Weight.\n6. If it reads between 190 g and 210 g inclusive, the scale is fine.\n7. If not, press Calibrate to 200g.\n8. Press Get Weight. It should read 200 g.\n9. If it still will not read 200 g, post in the WhatsApp channel.\n\nAdditional info\nDo this every visit, before maintenance mode when practical. Maintenance Mode is its own checklist step. This is the UofT drink/ice scale — not the Sinai/RBC robot arm Auto Calibrate weight check."

  - phase: prep
    title: Before the milk cleaning
    items:
      - key: maintenance_mode
        title: Put the kiosk in maintenance mode
        cadence: every_visit
        required: true
        blocks_clean_start: true
        details: "1. Scan in with the KCM app. The options appear after that scan.\n2. On the order pickup tablet, press Maintenance Mode."

  - phase: clean_start
    title: Milk cleaning
    items:
      - key: start_milk_clean
        title: Start milk module cleaning
        cadence: every_visit
        required: true
        details: "1. Press Clean on the milk frother and follow the prompts.\n2. Fill the water pitcher with 750 mL of water and 30 mL of blue Rinza.\n3. When the frother tells you to, take the tubes out of the milk and put them in the water.\n4. Keep the fridge door shut.\n\nAdditional info\nThe cleaning runs about 9 minutes. Don't touch the module while it runs. UofT uses Rinza here — not EverClean."

  - phase: during_clean
    title: While the cleaning runs
    items:
      - key: milk_bag
        title: Change the milk bag if it is due
        cadence: every_n_days
        days: 4
        required: true
        details: "No milk stays in a bag more than 4 days. Don't touch the tubes while they are in the cleaning pitcher. When you put the tubes back in the milk, the suction tube must sit 1 inch lower than the sensor tube.\n\nAdditional info\nUofT has one milk, 2%. An uncovered pitcher or an open fridge door during cleaning lets steam freeze inside the fridge."
      - key: milk_topup
        title: Top up 2% milk
        cadence: every_visit
        required: true
        details: "This kiosk uses 2% only. Don't touch the tubes."
      - key: concentrate
        title: Coffee concentrate
        cadence: below_threshold
        required: true
        details: "Minimum two-thirds full. If below two-thirds, refill. If at or above two-thirds, leave alone."
      - key: syrup
        title: Syrup cleaning and top-ups
        cadence: every_visit
        required: true
        details: "1. Open the syrup drawer.\n2. Press Clean.\n3. Follow the prompts on the syrup containers.\n4. At the final tube refill, when syrup is visible from all spouts, press OK so it does not keep pouring.\n5. Wipe the bottles with hot water.\n6. Push the nozzles at the end of the tubes fully down so they reach deep into the liquid, not just the surface.\n7. Caps tight on top.\n8. Run a pipe cleaner through the syrup nozzles so they don't clog.\n\nAdditional info\nAt UofT (2.2), move the cup holder out of the way. At Sinai (3.5) and RBC (S5), park the robotic arm out of the way."
      - key: powder_clean
        title: Clean the powder nozzles
        cadence: every_visit
        required: true
        details: "1. Lay a damp paper towel under the dispenser first to catch fallout.\n2. Turn the nozzles upward and take out the funnels.\n3. Check for powder buildup or residue. If there is residue, deep clean it, and it must be completely dry before you put it back. Wetness causes more buildup.\n4. Vacuum any loose powder with the handheld vacuum.\n5. Turn all three powder spouts back to down-facing, or powder drinks come out as plain hot water.\n\nAdditional info\nPowdered matcha is not in use right now — do not spend time servicing an unused matcha container. Do not delete history for past matcha rows."
      - key: powder_fill
        title: Powders
        cadence: below_threshold
        required: true
        details: "Fill only if below half. Matcha is unused — leave that container alone."
      - key: cups_lids
        title: Cups and lids
        cadence: below_threshold
        required: true
        details: "Gently twist stuck 16 oz cold cups apart before loading, then seat them lightly in the cup holder. Otherwise they jam at the top and won't dispense."
      - key: garbage
        title: Cup and drink garbage
        cadence: check_decide
        required: true
        details: "Quick look. Empty it only if it is worth it."
      - key: glass
        title: Glass and surfaces
        cadence: every_visit
        required: true
        details: "If splashes or marks would make you not want to buy from it, wipe it."

  - phase: close
    title: Close up
    items:
      - key: kc_consumables
        title: Update consumables in KC Manager
        cadence: every_visit
        required: true
        details: "Enter what you filled: milk, syrups, powders, cups, lids and coffee concentrate. Confirm updates in command history.\n\nAdditional info\nFor milk in the Kiosoft consumables app only: enter the actual amount added minus 500 mL (example: add 8,000 mL → enter 7,500 mL). This does not change how much milk you actually add, and it does not change KioskOps inventory or rewrite history. Do not use the old 1,000–1,500 mL under-report text."
      - key: exit_maint
        title: Exit maintenance mode
        cadence: every_visit
        required: true
      - key: test_drink
        title: Test drink
        cadence: every_visit
        required: true
        details: "Order a milk-based test drink (like a latte) so the frother runs its self-rinse. Check it comes out correctly.\n\nAdditional info\nThe drink must include milk. App-credit payment policy is not newly required by this update."

  - phase: rare
    title: Less often
    items:
      - key: deep_clean_nozzles
        title: Deep clean milk nozzles
        cadence: biweekly
        required: true
      - key: deep_clean_fridges
        title: Deep clean fridges
        cadence: monthly
        required: true
